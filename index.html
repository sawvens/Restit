<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Points de restitution</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600;700&display=swap');
  :root{
    --bg:#F5F6F7; --surface:#FFFFFF; --surface-2:#EEF0F2; --line:#DDE1E5;
    --text:#1A1D20; --muted:#6B7280; --amber:#B8860B; --teal:#0E8A7D; --danger:#D9432B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(14,138,125,0.05), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(184,134,11,0.05), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
  }
  .app-root{padding:20px 16px 40px;max-width:520px;margin:0 auto;}
  .header{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .header-icon{width:38px;height:38px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--amber);font-size:19px;}
  .header h1{font-family:'Oswald', sans-serif;font-weight:600;font-size:19px;letter-spacing:0.02em;text-transform:uppercase;margin:0;}
  .header p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}

  .search-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .search-row{display:flex;gap:8px;}
  .search-input-wrap{flex:1;position:relative;}
  .search-input-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);}
  input[type="text"]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px 12px 11px 34px;color:var(--text);font-size:14.5px;font-family:'Inter', sans-serif;outline:none;}
  input[type="text"]::placeholder{color:var(--muted);}
  input[type="text"]:focus{border-color:var(--teal);}
  .btn{border:none;border-radius:9px;font-family:'Inter', sans-serif;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s ease, opacity .12s ease;}
  .btn:active{transform:scale(0.96);}
  .btn:disabled{opacity:0.5;cursor:default;}
  .btn-primary{background:var(--amber);color:#1A1300;padding:0 16px;height:42px;}
  .btn-geo{width:100%;margin-top:10px;background:transparent;border:1px dashed var(--line);color:var(--teal);padding:10px;}
  .btn-geo:hover{border-color:var(--teal);}
  .btn-retry{width:100%;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:9px;}
  .status-row{margin-top:10px;font-size:12.5px;color:var(--muted);display:flex;align-items:flex-start;gap:6px;}
  .status-row.err{color:var(--danger);}
  .status-row.warn{color:var(--amber);}
  .spin{animation:spin 0.8s linear infinite;display:inline-block;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .geo-progress{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px;}

  .map-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:14px;}
  .map-el{width:100%;height:320px;border-radius:9px;overflow:hidden;background:var(--surface-2);}
  .leaflet-container{background:var(--surface-2) !important;font-family:'Inter', sans-serif;}
  .user-pin{width:14px;height:14px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 5px rgba(14,138,125,0.2);}
  .center-pin{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:12.5px;color:#14171A;border:2px solid rgba(20,23,26,0.7);}
  .dot-pin{width:14px;height:14px;border-radius:50%;background:var(--amber);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.35);}
  .dot-pin.dim{background:#9AA1AB;}
  .popup-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;}
  .popup-addr{font-size:12px;color:var(--muted);line-height:1.4;}

  .results-label{font-family:'Oswald', sans-serif;text-transform:uppercase;font-size:12px;letter-spacing:0.08em;color:var(--muted);margin:4px 2px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .results-label b{color:var(--text);}
  .link-btn{background:none;border:none;color:var(--teal);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;text-transform:none;letter-spacing:0;padding:0;}
  .result-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;}
  .result-card.rank-0{border-color:rgba(184,134,11,0.5);}
  .rank-badge{font-family:'Oswald', sans-serif;font-weight:700;font-size:15px;width:30px;height:30px;border-radius:8px;background:var(--surface-2);color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rank-badge.top{background:var(--amber);color:#1A1300;}
  .result-info{flex:1;min-width:0;}
  .result-name{font-family:'Oswald', sans-serif;font-weight:600;font-size:15.5px;margin:0 0 3px;}
  .result-addr{font-size:12px;color:var(--muted);line-height:1.4;}
  .stat-box{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
  .stat-dist{font-family:'JetBrains Mono', monospace;font-weight:700;font-size:16px;color:var(--teal);}
  .stat-dur{font-family:'Inter', sans-serif;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px;}
  .empty-hint{text-align:center;padding:22px 12px;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:14px;margin-bottom:14px;}

  .list-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px;}
  .list-card summary{font-family:'Oswald', sans-serif;text-transform:uppercase;font-size:13px;letter-spacing:0.08em;padding:12px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  .list-card summary::-webkit-details-marker{display:none;}
  .list-card summary span{color:var(--muted);font-family:'Inter',sans-serif;font-size:12px;text-transform:none;letter-spacing:0;}
  .center-item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;}
  .center-item:active{background:var(--surface-2);}
  .center-item .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);margin-top:5px;flex-shrink:0;}
  .center-item .nm{font-family:'Oswald',sans-serif;font-weight:600;font-size:14.5px;margin:0 0 2px;}
  .center-item .ad{font-size:12px;color:var(--muted);line-height:1.4;}
</style>
</head>
<body>
<div class="app-root">
  <div class="header">
    <div class="header-icon">🚗</div>
    <div>
      <h1>Points de restitution</h1>
      <p>Distance et itinéraire réels vers les 3 centres les plus proches</p>
    </div>
  </div>

  <div class="search-card">
    <div class="search-row">
      <div class="search-input-wrap">
        <span class="ic">🔍</span>
        <input type="text" id="queryInput" placeholder="Code postal ou ville" />
      </div>
      <button class="btn btn-primary" id="searchBtn">Chercher</button>
    </div>
    <button class="btn btn-geo" id="geoBtn">🧭 Utiliser ma position actuelle</button>
    <div id="geoProgress" class="geo-progress">Chargement des centres…</div>
    <div id="statusArea"></div>
  </div>

  <div class="map-card"><div class="map-el" id="map"></div></div>

  <div id="resultsArea">
    <div class="empty-hint">Touchez un point sur la carte, ou indiquez un code postal / une ville (ou votre position) pour afficher les centres les plus proches par la route.</div>
  </div>

  <details class="list-card" open>
    <summary>Tous les centres <span id="centersCount"></span></summary>
    <div id="centersList"></div>
  </details>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* fb = coordonnées approximatives (affichage immédiat sur la carte) ; elles sont affinées par géocodage ensuite */
const CENTERS = [
  { id:"aix", name:"Aix-en-Provence", line1:"LE SHED - Route de la Côte d'Azur, RN 7", line2:"13590 Meyreuil", query:"Route de la Côte d'Azur, 13590 Meyreuil", fb:[43.4617,5.5314] },
  { id:"annecy", name:"Annecy", line1:"25 route de la Salle", line2:"74960 Cran-Gevrier", query:"25 route de la Salle, 74960 Cran-Gevrier", fb:[45.9, 6.09] },
  { id:"bordeaux", name:"Bordeaux", line1:"30 rue du 503e Régiment du Train", line2:"33127 Martignas-sur-Jalle", query:"30 rue du 503e Régiment du Train, 33127 Martignas-sur-Jalle", fb:[44.8396,-0.7787] },
  { id:"chilly", name:"Chilly-Mazarin", line1:"Rue Hélène Boucher, Butte au Berger", line2:"91380 Chilly-Mazarin", query:"Rue Hélène Boucher, 91380 Chilly-Mazarin", fb:[48.70,2.31] },
  { id:"lille", name:"Lille", line1:"121 Rue Pierre Brizon", line2:"59810 Lesquin", query:"121 Rue Pierre Brizon, 59810 Lesquin", fb:[50.59,3.11] },
  { id:"lyon", name:"Lyon", line1:"145 Route de Grenoble", line2:"69800 Saint-Priest", query:"145 Route de Grenoble, 69800 Saint-Priest", fb:[45.695,4.94] },
  { id:"mulhouse", name:"Mulhouse", line1:"2 Avenue de Lisbonne", line2:"68110 Illzach", query:"2 Avenue de Lisbonne, 68110 Illzach", fb:[47.77,7.35] },
  { id:"nanterre", name:"Nanterre Lavoisier", line1:"19 rue Lavoisier", line2:"92000 Nanterre", query:"19 rue Lavoisier, 92000 Nanterre", fb:[48.892,2.206] },
  { id:"nantes", name:"Nantes", line1:"1 Rue des Châtaigniers, Parc du Butay", line2:"44690 Château-Thébaud", query:"1 Rue des Châtaigniers, 44690 Château-Thébaud", fb:[47.19,-1.48] },
  { id:"nice", name:"Nice", line1:"1ère Avenue – 15ème Rue", line2:"06510 Carros", query:"1ere Avenue 15eme Rue, 06510 Carros", fb:[43.79,7.19] },
  { id:"rennes", name:"Rennes", line1:"3 Impasse de la Croix Rouge", line2:"35520 La Chapelle-des-Fougeretz", query:"3 Impasse de la Croix Rouge, 35520 La Chapelle des Fougeretz", fb:[48.155,-1.72] },
  { id:"strasbourg", name:"Strasbourg", line1:"15 allée des Forgerons", line2:"67960 Entzheim", query:"15 allee des Forgerons, 67960 Entzheim", fb:[48.54,7.64] },
  { id:"toulouse", name:"Toulouse", line1:"1 Avenue de l'Industrie", line2:"31150 Bruguières", query:"1 Avenue de l'Industrie, 31150 Bruguieres", fb:[43.72,1.40] },
  { id:"tours", name:"Tours", line1:"Avenue des Landes du Cassantin, ZAC du Cassantin", line2:"37210 Parçay-Meslay", query:"Avenue des Landes du Cassantin, 37210 Parcay Meslay", fb:[47.44,0.78] },
];
const RANK_COLORS = ["#B8860B", "#0E8A7D", "#6B7280"];
const FRANCE_BOUNDS = [[41.2,-5.4],[51.2,9.8]];
const EMPTY_HINT = `<div class="empty-hint">Touchez un point sur la carte, ou indiquez un code postal / une ville (ou votre position) pour afficher les centres les plus proches par la route.</div>`;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
let centers = CENTERS.map(c => ({...c, lat:c.fb[0], lon:c.fb[1]}));
let map, layerGroup, userCoords = null, lastAction = null;

function formatDuration(seconds){
  const totalMin = Math.round(seconds / 60);
  if (totalMin < 60) return `${totalMin} min`;
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return m === 0 ? `${h} h` : `${h} h ${String(m).padStart(2, "0")} min`;
}

async function fetchWithTimeout(url, ms=9000){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms);
  try { return await fetch(url, {signal: ctrl.signal}); } finally { clearTimeout(t); }
}
/* ---------- Géocodage robuste : plusieurs services en cascade ---------- */

async function getJSON(url, ms=9000){
  try{
    const res = await fetchWithTimeout(url, ms);
    if(!res.ok) return null;
    return await res.json();
  }catch{ return null; }
}

// 1) BAN / Géoplateforme (adresses françaises)
async function banSearch(query, params={}){
  if(!query) return null;
  const qs = new URLSearchParams({ q: query, limit: "1", ...params });
  const data = await getJSON(`https://data.geopf.fr/geocodage/search?${qs}`);
  const f = data?.features?.[0];
  if(!f?.geometry?.coordinates) return null;
  const [lon, lat] = f.geometry.coordinates;
  if(typeof lat !== "number" || typeof lon !== "number") return null;
  return { lat, lon, label: f.properties?.label || query };
}

// 2) API Découpage administratif (fiable pour TOUS les codes postaux, y compris DOM)
async function communeByPostcode(cp){
  const data = await getJSON(`https://geo.api.gouv.fr/communes?codePostal=${encodeURIComponent(cp)}&fields=nom,centre&format=json&geometry=centre`);
  const c = Array.isArray(data) ? data[0] : null;
  const coords = c?.centre?.coordinates;
  if(!coords) return null;
  return { lat: coords[1], lon: coords[0], label: `${c.nom} (${cp})` };
}
async function communeByName(name){
  const data = await getJSON(`https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(name)}&fields=nom,codesPostaux,centre&format=json&geometry=centre&boost=population&limit=1`);
  const c = Array.isArray(data) ? data[0] : null;
  const coords = c?.centre?.coordinates;
  if(!coords) return null;
  return { lat: coords[1], lon: coords[0], label: `${c.nom}${c.codesPostaux?.[0] ? ` (${c.codesPostaux[0]})` : ""}` };
}

// 3) Nominatim / OpenStreetMap (dernier recours)
async function nominatim(query){
  const qs = new URLSearchParams({ q: query, format: "json", limit: "1", countrycodes: "fr" });
  const data = await getJSON(`https://nominatim.openstreetmap.org/search?${qs}`);
  const r = Array.isArray(data) ? data[0] : null;
  if(!r) return null;
  return { lat: parseFloat(r.lat), lon: parseFloat(r.lon), label: r.display_name?.split(",").slice(0,2).join(",") || query };
}

/* Résout n'importe quelle saisie : code postal, ville, adresse, "92390 Villeneuve"… */
async function resolveLocation(raw){
  const q = raw.replace(/\s+/g, " ").trim();
  if(!q) return null;
  const cpMatch = q.match(/\b(\d{5})\b/);
  const cp = cpMatch ? cpMatch[1] : null;
  const isOnlyCp = /^\d{5}$/.test(q);

  const attempts = [];
  if(isOnlyCp){
    attempts.push(() => communeByPostcode(cp));
    attempts.push(() => banSearch(cp, { type: "municipality" }));
    attempts.push(() => banSearch(cp, { postcode: cp }));
    attempts.push(() => banSearch(cp));
    attempts.push(() => nominatim(`${cp} France`));
  } else {
    attempts.push(() => banSearch(q, cp ? { postcode: cp } : {}));
    attempts.push(() => banSearch(q));
    const cityOnly = q.replace(/\b\d{5}\b/g, "").replace(/[,;]+/g, " ").trim();
    if(cityOnly) attempts.push(() => communeByName(cityOnly));
    if(cp) attempts.push(() => communeByPostcode(cp));
    attempts.push(() => nominatim(`${q}, France`));
  }

  for(const attempt of attempts){
    const r = await attempt();
    if(r && Number.isFinite(r.lat) && Number.isFinite(r.lon)) return r;
  }
  return null;
}

// Géocodage d'un centre (adresse connue) avec repli sur le code postal
async function geocodeCenter(c){
  const cp = (c.line2.match(/\b(\d{5})\b/) || [])[1] || null;
  return (await banSearch(c.query))
      || (cp ? await banSearch(c.query, { postcode: cp }) : null)
      || (cp ? await communeByPostcode(cp) : null)
      || (await nominatim(`${c.query}, France`));
}
async function osrmDistance(lat1,lon1,lat2,lon2){
  const url = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=false`;
  const res = await fetchWithTimeout(url);
  if(!res.ok) return null;
  const data = await res.json();
  if(data.code!=="Ok" || !data.routes?.length) return null;
  return { distance:data.routes[0].distance, duration:data.routes[0].duration };
}
async function osrmRoute(lat1,lon1,lat2,lon2){
  const url = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=full&geometries=geojson`;
  const res = await fetchWithTimeout(url);
  if(!res.ok) return null;
  const data = await res.json();
  if(data.code!=="Ok" || !data.routes?.length) return null;
  return { distance:data.routes[0].distance, duration:data.routes[0].duration, geometry:data.routes[0].geometry };
}

function setStatus(html, cls){
  document.getElementById('statusArea').innerHTML = html ? `<div class="status-row ${cls||''}">${html}</div>` : '';
}
function setBusy(isBusy){
  document.getElementById('searchBtn').disabled = isBusy;
  document.getElementById('geoBtn').disabled = isBusy;
}

let centersReady = null;
async function initCenters(){
  await Promise.all(centers.map(async c => {
    try {
      const g = await geocodeCenter(c);
      if(g && Number.isFinite(g.lat) && Number.isFinite(g.lon)){ c.lat = g.lat; c.lon = g.lon; c.geocoded = true; }
    } catch {}
  }));
  const ok = centers.filter(c => c.geocoded).length;
  const prog = document.getElementById('geoProgress');
  if(ok === 0){
    prog.textContent = "⚠️ Adresses exactes indisponibles : positions approximatives affichées.";
  } else {
    prog.style.display = 'none';
  }
  // Affine les marqueurs si on est toujours sur la vue d'ensemble
  if(!userCoords) drawOverview(false);
  return ok;
}

/* ---------- Carte ---------- */
function initMap(){
  map = L.map('map', {zoomControl:true, attributionControl:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap', maxZoom:19
  }).addTo(map);
  layerGroup = L.layerGroup().addTo(map);
  map.fitBounds(FRANCE_BOUNDS);
}

function popupHtml(c){
  return `<div class="popup-name">${c.name}</div><div class="popup-addr">${c.line1}<br>${c.line2}</div>`;
}
function dotMarker(c, dim){
  const icon = L.divIcon({className:'', html:`<div class="dot-pin ${dim?'dim':''}"></div>`, iconSize:[14,14]});
  return L.marker([c.lat, c.lon], {icon}).bindPopup(popupHtml(c)).bindTooltip(c.name, {direction:'top', offset:[0,-6]});
}

// Vue d'ensemble : tous les centres sur la carte de France
function drawOverview(fit=true){
  layerGroup.clearLayers();
  centers.forEach(c => dotMarker(c, false).addTo(layerGroup));
  if(fit) map.fitBounds(FRANCE_BOUNDS);
}

function renderCentersList(){
  document.getElementById('centersCount').textContent = `${centers.length} centres`;
  document.getElementById('centersList').innerHTML = centers.map(c => `
    <div class="center-item" onclick="focusCenter('${c.id}')">
      <div class="dot"></div>
      <div>
        <p class="nm" style="margin:0 0 2px">${c.name}</p>
        <div class="ad">${c.line1}<br>${c.line2}</div>
      </div>
    </div>`).join('');
}
function focusCenter(id){
  const c = centers.find(x => x.id === id);
  if(!c) return;
  map.setView([c.lat, c.lon], 11);
  L.popup().setLatLng([c.lat, c.lon]).setContent(popupHtml(c)).openOn(map);
  document.getElementById('map').scrollIntoView({behavior:'smooth', block:'center'});
}

function resetView(){
  userCoords = null;
  setStatus('');
  document.getElementById('resultsArea').innerHTML = EMPTY_HINT;
  drawOverview(true);
}

function renderResults(results){
  if(results.length===0) return;
  const area = document.getElementById('resultsArea');
  let html = `<div class="results-label"><span>Les <b>3 centres</b> les plus proches (route)</span><button class="link-btn" onclick="resetView()">Voir tous les centres</button></div>`;
  results.forEach((r,i)=>{
    html += `<div class="result-card rank-${i}">
      <div class="rank-badge ${i===0?'top':''}">${i+1}</div>
      <div class="result-info">
        <p class="result-name">${r.name}</p>
        <p class="result-addr">${r.line1}<br>${r.line2}</p>
      </div>
      <div class="stat-box">
        <span class="stat-dist">${(r.distance/1000).toFixed(1)} km</span>
        <span class="stat-dur">⏱ ${formatDuration(r.duration)}</span>
      </div>
    </div>`;
  });
  area.innerHTML = html;

  layerGroup.clearLayers();
  // Autres centres en gris discret
  const topIds = new Set(results.map(r => r.id));
  centers.filter(c => !topIds.has(c.id)).forEach(c => dotMarker(c, true).addTo(layerGroup));

  const userIcon = L.divIcon({className:'', html:`<div class="user-pin"></div>`, iconSize:[16,16]});
  L.marker([userCoords.lat, userCoords.lon], {icon:userIcon}).addTo(layerGroup);
  const bounds = [[userCoords.lat, userCoords.lon]];
  results.forEach((r,i)=>{
    if(r.geometry){
      const latlngs = r.geometry.coordinates.map(([lon,lat])=>[lat,lon]);
      L.polyline(latlngs, {color:RANK_COLORS[i], weight:3.5, opacity:0.85}).addTo(layerGroup);
      latlngs.forEach(p=>bounds.push(p));
    }
    const icon = L.divIcon({className:'', html:`<div class="center-pin" style="background:${RANK_COLORS[i]}">${i+1}</div>`, iconSize:[24,24]});
    L.marker([r.lat, r.lon], {icon}).bindPopup(popupHtml(r)).addTo(layerGroup);
    bounds.push([r.lat, r.lon]);
  });
  map.fitBounds(bounds, {padding:[28,28]});
}

async function computeResults(lat, lon, label){
  userCoords = {lat, lon};
  setBusy(true);
  setStatus(`<span class="spin">⏳</span> Préparation des centres…`);
  await centersReady;
  const valid = centers.filter(c=>c.lat!==null && c.lon!==null);
  if(valid.length===0){
    setBusy(false);
    setStatus("⚠️ Les adresses des centres n'ont pas pu être chargées.<br><button class='btn btn-retry' onclick='retry()'>🔄 Réessayer</button>", "err");
    return;
  }
  const withDist = [];
  let done = 0;
  for(const c of valid){
    try {
      const r = await osrmDistance(lat, lon, c.lat, c.lon);
      if(r) withDist.push({...c, distance:r.distance, duration:r.duration});
    } catch {}
    done++;
    setStatus(`<span class="spin">⏳</span> Calcul des itinéraires réels… (${done}/${valid.length})`);
    await sleep(300);
  }
  if(withDist.length===0){
    setBusy(false);
    setStatus("⚠️ Le service d'itinéraire ne répond pas pour le moment. Réessayez dans une minute.<br><button class='btn btn-retry' onclick='retry()'>🔄 Réessayer</button>", "err");
    return;
  }
  const sorted = withDist.sort((a,b)=>a.distance-b.distance).slice(0,3);
  const withGeom = [];
  for(const c of sorted){
    try {
      const g = await osrmRoute(lat, lon, c.lat, c.lon);
      withGeom.push({...c, geometry: g?.geometry ?? null});
    } catch { withGeom.push({...c, geometry:null}); }
    await sleep(300);
  }
  setBusy(false);
  const warn = withDist.length < valid.length ? "⚠️ Certains centres n'ont pas pu être calculés. " : "";
  setStatus(`${warn}📍 Depuis : ${label}`, warn ? "warn" : "");
  renderResults(withGeom);
}

async function handleSearch(){
  const q = document.getElementById('queryInput').value.trim();
  if(!q) return;
  lastAction = {type:'search', value:q};
  setBusy(true);
  setStatus(`<span class="spin">⏳</span> Recherche de l'adresse…`);
  try {
    const g = await resolveLocation(q);
    if(!g){
      setBusy(false);
      setStatus("Aucune localisation trouvée pour « " + q.replace(/</g,'&lt;') + " ». Essayez un code postal à 5 chiffres ou un nom de commune.<br><button class='btn btn-retry' onclick='retry()'>🔄 Réessayer</button>", "err");
      return;
    }
    await computeResults(g.lat, g.lon, g.label);
  } catch {
    setBusy(false);
    setStatus("La recherche a échoué. Vérifiez votre connexion et réessayez.<br><button class='btn btn-retry' onclick='retry()'>🔄 Réessayer</button>", "err");
  }
}

function handleGeolocate(){
  lastAction = {type:'geo'};
  if(!navigator.geolocation){
    setStatus("La géolocalisation n'est pas disponible sur cet appareil.", "err");
    return;
  }
  setBusy(true);
  setStatus(`<span class="spin">⏳</span> Localisation en cours…`);
  navigator.geolocation.getCurrentPosition(
    (pos)=> computeResults(pos.coords.latitude, pos.coords.longitude, "Ma position actuelle"),
    (err)=>{
      setBusy(false);
      const msg = err.code===1 ? "Localisation refusée. Autorisez l'accès à la position, puis réessayez." : "Impossible d'obtenir votre position. Réessayez.";
      setStatus(msg, "err");
    },
    { enableHighAccuracy:true, timeout:12000 }
  );
}
function retry(){ if(!lastAction) return; lastAction.type==='search' ? handleSearch() : handleGeolocate(); }

document.getElementById('searchBtn').addEventListener('click', handleSearch);
document.getElementById('queryInput').addEventListener('keydown', e => { if(e.key==='Enter') handleSearch(); });
document.getElementById('geoBtn').addEventListener('click', handleGeolocate);

initMap();
drawOverview(true);
renderCentersList();
centersReady = initCenters();
</script>
</body>
